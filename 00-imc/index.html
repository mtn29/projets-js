<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="title"> Calculatrice - IMC </div>
        <div class="input">
            <label>Nom:</label>
            <input type="text" id='nom'>
        </div>
        <div class="input">
            <label>Taille:</label>
            <input type="number" id='taille'>
        </div>
        <div class="input">
            <label>Poids:</label>
            <input type="number" id='poids'>
        </div>
        <button id='calcular'>Calculer</button>

        <div class="result" id='resultat'></div>
      </div>
    </main>
    <script src="./imc.js"></script>
  </body>
</html>
